spring:
  application:
    name: msvc-catalog

  datasource:
    url: jdbc:postgresql://localhost:5432/pizza_catalog
    username: postgres
    password: 12345

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8000